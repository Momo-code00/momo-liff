<style>

ne;border-radius:6px;background:#EEF0F3 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center}.sm2{font-weight:400;color:#8A8F98;font-size:11px}

</style></head><body>
<div class="top"><span id="mode">Update</span><div class="sub" id="title">Loading…</div></div>
<div class="list" id="list"><div class="msg">Loading tasks…</div></div>

<div class="ov" id="ov2"><div class="box"><h3>↩️ Cancel approval?</h3><p id="uq"></p><p>The date Momo saved will be removed from the file and this job will be open again.</p><div class="row"><button id="uno" style="background:#EEF0F3;color:#333">No, keep it</button><button id="uyes" style="background:#E53935;color:#fff">Yes, cancel</button></div></div></div>
<script>
var API='https://script.google.com/macros/s/AKfycby-mKc61mA8ltIxGrW4AcUjUjvLzAneA-A81Bb6Kknu1-fsAhGHA-422l-dJzyU389_MQ/exec';
var LIFF_ID='2012059107-CtVtW1SW', P={}, M='', DATA=null, liffOk=false;
function $(id){return document.getElementById(id)}
function qs(s){s.replace(/^\?/,'').split('&').forEach(function(kv){var a=kv.split('=');if(a[0])P[decodeURIComponent(a[0])]=decodeURIComponent((a[1]||'').replace(/\+/g,' '))})}
function api(q){return fetch(API+'?'+q).then(function(r){return r.json()})}
function closeWin(){try{if(liffOk&&liff.isInClient()){liff.closeWindow();return}}catch(e){}window.close();history.back()}
function fail(t){$('list').innerHTML='<div class="msg">'+t+'</div>';$('send').style.display='none';$('cancel').textContent='Close'}
function count(){var n=document.querySelectorAll('input:checked').length;$('send').disabled=!n;$('send').textContent=n?'📤 Submit for approval ('+n+')':'📤 Submit for approval'}
function linkify(el,s){s.split(/(https?:\/\/\S+)/).forEach(function(p){if(/^https?:\/\//.test(p)){var a=document.createElement('a');a.href=p;a.textContent=/maps|goo\.gl/.test(p)?'Open map ›':p;a.style.color='#1E6FD9';a.target='_top';el.appendChild(a)}else el.appendChild(document.createTextNode(p))})}
var ROW=/^•\s*(.+?)\s+—\s+(\d+)\s*ไซต์\s*·\s*ค้าง\s*(\d+)\s*·\s*เร่ง\s*(\d+)\s*$/;
var CMP=/^•\s*(.+?)\s+—\s+เสร็จ\s*(\d+)\s*\(([^)]*)\)\s*·\s*ค้าง\s*(\d+)\s*\(([^)]*)\)\s*$/;
function readBody(el,s){var L=s.split('\n'),buf=[],rows=[];
  function fb(){if(buf.length){linkify(el,buf.join('\n')+'\n');buf=[]}}
  function fr(){if(!rows.length)return;var t=document.createElement('table');t.className='pe';
    var h='<tr><th>Owner</th><th>Sites</th><th>Open</th><th>Urgent</th></tr>';
    rows.forEach(function(m){var e=function(x){return String(x).replace(/[<&]/g,function(c){return c=='<'?'&lt;':'&amp;'})};
      h+='<tr><td>'+e(m[1])+'</td><td>'+m[2]+'</td><td class="'+(+m[3]?'r':'z')+'">'+m[3]+'</td><td class="'+(+m[4]?'o':'z')+'">'+m[4]+'</td></tr>'});
    t.innerHTML=h;el.appendChild(t);rows=[]}
  var crow=[];function dc(d,up){return d=='='?'z':((d[0]=='▲')==up?'g':'r')}
  function fc(){if(!crow.length)return;var t=document.createElement('table');t.className='pe';var h='<tr><th></th><th>Done</th><th>Open</th></tr>';
    crow.forEach(function(m){h+='<tr><td>'+m[1].replace(/</g,'&lt;')+'</td><td><b>'+m[2]+'</b><small class="'+dc(m[3],true)+'">'+m[3]+'</small></td><td><b>'+m[4]+'</b><small class="'+dc(m[5],false)+'">'+m[5]+'</small></td></tr>'});
    t.innerHTML=h;el.appendChild(t);crow=[]}
  var SEC=/^(🔨 กำลังดำเนินการ|⏳ รอสำรวจ \(|⚠️ ยังค้าง \(|✅ ปิดงานแล้ว \(|✅ สำรวจแล้ว|✅ ปิดแล้ว)/;
  L.forEach(function(l){if(/^┈{6,}$/.test(l)){fb();fr();fc();var h=document.createElement('hr');h.className='sub';el.appendChild(h);return}
    if(SEC.test(l)){fb();fr();fc();var d=document.createElement('div');d.className='sec '+(/^✅/.test(l)?'ok':'wip');d.textContent=l;el.appendChild(d);return}
    var c=l.match(CMP);if(c){fb();fr();crow.push(c);return}fc();var m=l.match(ROW);if(m){fb();rows.push(m)}else{fr();buf.push(l)}});fc();fr();fb()}
function render(r){
  if(!r||r.error){fail(r?r.error:'Could not load.');return}
  DATA=r;$('title').textContent=r.title||'';$('list').innerHTML='';$('send').style.display='';
  if(M==='read'){
    $('mode').textContent='Details';
    var d=document.createElement('div');d.className='read';readBody(d,r.body||'-');$('list').appendChild(d);
    (r.maps||[]).forEach(function(m){if(!/^https?:\/\//.test(m.u||''))return;var a=document.createElement('a');a.className='mapbtn';a.href=m.u;a.target='_blank';a.rel='noopener';a.textContent='📍 '+m.n;a.onclick=function(e){try{if(window.liff&&liff.isInClient&&liff.isInClient()){e.preventDefault();liff.openWindow({url:m.u,external:true})}}catch(x){}};$('list').appendChild(a)});  // v113: แผนที่นำทางในหน้า Read more
    $('cancel').textContent='Close';
    if(r.own&&r.items.length){$('send').disabled=false;$('send').textContent='✅ Update ('+r.items.length+')';$('send').onclick=function(){M='';$('send').onclick=send;render(DATA)}}
    else $('send').style.display='none';
    return;
  }
  $('mode').textContent='Update';$('cancel').textContent='Cancel';
  if(!r.items.length){fail('No open tasks left in this list 🎉');return}
  (r.groups&&r.groups.length?r.groups:[{p:'',n:r.items.map(function(t,i){return{i:i,t:t}})}]).forEach(function(g,gi){if(g.p){var h=document.createElement('div');h.className='grp';h.textContent=(gi+1)+'. '+g.p+' · '+g.n.length+(g.n.length>1?' items':' item');$('list').appendChild(h)}g.n.forEach(function(x){var l=document.createElement('label'),c=document.createElement('input'),s=document.createElement('span');c.type='checkbox';c.value=x.i;c.onchange=count;s.textContent=x.t;l.appendChild(c);l.appendChild(s);$('list').appendChild(l)})});  // v120: แยกหัวข้อโครงการ
  count();
}
function send(){
  var idx=[].map.call(document.querySelectorAll('input:checked'),function(c){return c.value});
  if(!idx.length)return;$('send').disabled=true;$('send').textContent='Sending…';
  api('api=submit&k='+P.k+'&i='+P.i+'&idx='+idx.join(',')).then(function(r){
    if(!r||r.error){$('send').disabled=false;count();$('title').textContent=r?r.error:'Could not send.';return}
    var ok=false;try{ok=liffOk&&liff.isInClient()}catch(e){}
    if(ok) liff.sendMessages([{type:'text',text:r.text}]).then(function(){liff.closeWindow()}).catch(function(){manual(r.text)});
    else manual(r.text);
  }).catch(function(e){$('send').disabled=false;count();$('title').textContent='Could not send. Please try again.'});
}
function manual(t){
  $('list').innerHTML='<div class="msg">✅ Saved<br>Tap the button below, then choose the work group to send for approval</div><a style="display:block;margin:6px 12px;padding:14px;border-radius:10px;background:#06C755;color:#fff;text-align:center;font-weight:700;text-decoration:none" href="https://line.me/R/share?text='+encodeURIComponent(t)+'">📤 Send to LINE group</a><div class="msg" style="font-size:13px">Or copy this message and paste it in the group<textarea readonly>'+t.replace(/</g,'&lt;')+'</textarea></div>';
  $('send').style.display='none';$('cancel').textContent='Close';
}
$('send').onclick=send;$('cancel').onclick=closeWin;
function renderDup(r){if(!r||r.error){fail(r?r.error:'Could not load. Please close and open again.');return}
  DATA=r;$('mode').textContent='Approve';$('title').textContent=r.title||'';$('list').innerHTML='';
  var d=document.createElement('div');d.className='read';readBody(d,r.body||'-');$('list').appendChild(d);
  $('dq').textContent=(r.label||'')+'\n'+(r.why||'');$('uq').textContent=r.label||'';$('dun').style.display=r.canUndo?'block':'none';$('cancel').textContent='Close';
  $('send').style.display='';$('send').disabled=false;$('send').textContent='⚠️ Confirm approval';$('send').onclick=function(){$('ov').className='ov on'};
  $('ov').className='ov on'}
function dupTok(){var at='';try{if(liffOk)at=liff.getAccessToken()||''}catch(e){}return at}
function dupPost(o){o.at=dupTok();o.d=P.d||'';o.n=P.n||'';o.ts=P.ts||'';o.sg=P.sg||'';o.gc=P.gc||'';try{var c=liffOk&&liff.getContext();if(c){o.ctx=c.type||'';o.cg=c.groupId||c.roomId||''}}catch(e){}return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)}).then(function(x){return x.json()})}
function cardMsg(t){t=String(t||'');var L=t.split('\n').filter(function(s){return s.trim()}),u=(t.match(/https?:\/\/\S+/)||[])[0];if(!u||!L.length)return {type:'text',text:t};var b=[{type:'text',text:L[0],weight:'bold',size:'md',wrap:true}];L.slice(1).forEach(function(s){if(s.indexOf(u)<0)b.push({type:'text',text:s,size:'sm',color:'#555555',wrap:true,margin:'sm'})});return {type:'flex',altText:L[0].slice(0,300),contents:{type:'bubble',size:'kilo',body:{type:'box',layout:'vertical',contents:b},footer:{type:'box',layout:'vertical',contents:[{type:'button',style:'primary',height:'sm',color:'#06C755',action:{type:'uri',label:/Slides|PowerPoint|pptx/i.test(L[0])?'📊 Open Slides':'📄 Open PDF',uri:u}}]}}}}  // v124: ผลอนุมัติ → การ์ด + ปุ่มเปิดไฟล์
function sameBox(r,again){$('send').disabled=false;fcheck();var rv=' (Rev. '+(r.rev||0)+')';$('title').textContent='ℹ️ No changes — already approved'+rv;  // v128: อนุมัติซ้ำแต่ไม่ได้แก้ → ไม่ออก Rev ใหม่ / ไม่ส่งอีเมล (เฉพาะผู้อนุมัติ)
  var c=$('samebox');if(c)c.remove();c=document.createElement('div');c.id='samebox';var w=document.createElement('div');w.className='read';w.innerHTML='<b>No changes — this report was already approved'+rv+'.</b><br>No new PDF or email was sent.';c.appendChild(w);
  var b=document.createElement('button');b.className='mbtn';b.style.background='#0D47A1';b.innerHTML='<b>📄 Open PDF</b><small>Open the approved report</small>';b.onclick=function(){drOpen(r.url)};c.appendChild(b);
  var a=document.createElement('a');a.href='#';a.textContent='Create a new revision anyway';a.style.cssText='display:block;text-align:center;font-size:13px;color:#8A8F98;margin:4px 0 14px';a.onclick=function(e){e.preventDefault();if(a.getAttribute('data-busy'))return;a.setAttribute('data-busy','1');a.textContent='Creating a new revision…';again()};c.appendChild(a);
  var box=$('list');box.insertBefore(c,box.firstChild);try{window.scrollTo(0,0)}catch(e){}}
function shareBtn(box,r){try{if(!(window.liff&&liff.isApiAvailable&&liff.isApiAvailable('shareTargetPicker'))||!r||!r.url)return}catch(e){return}  // v125: แชร์การ์ดรายงานเข้ากลุ่มเอง (ไม่นับโควตา) → Momo ลบการ์ดที่เก็บไว้ (กันซ้ำ)
  var b=document.createElement('button');b.className='mbtn';b.style.background='#06C755';b.innerHTML='<b>📤 Share to group</b><small>Send this report card to a LINE group</small>';
  var w=document.createElement('div');w.className='shwarn';w.textContent='⚠️ Please include the project team group';
  b.onclick=function(){liff.shareTargetPicker([cardMsg(r.text)],{isMultiple:true}).then(function(res){if(res&&res.status==='success'){b.querySelector('small').textContent='✅ Shared';w.style.display='none';dupPost({api:'drshare',url:r.url}).catch(function(){})}}).catch(function(e){b.querySelector('small').textContent='⚠️ '+((e&&e.message)||'Could not share')})};
  box.appendChild(b);box.appendChild(w)}
function postCard(t){if(!inClient())return;liff.sendMessages([cardMsg(t)]).catch(function(){liff.sendMessages([{type:'text',text:t}]).catch(function(){})})}
function inClient(){try{return liffOk&&liff.isInClient()}catch(e){return false}}
function goSend(r,onFail){var w={ap:'✅ Approve: ',ap2:'✅ Approve again: ',rj:'❌ Reject: ',dn:'❌ Reject: ',undo:'↩️ Cancel approval: '}[r.act]||'✅ Approve: ';
  $('title').textContent=r.act==='rj'||r.act==='dn'?'❌ Not approved':r.act==='undo'?'↩️ Cancelling approval…':'✅ Approved';$('send').style.display='none';$('cancel').textContent='Close';
  $('list').innerHTML='<div class="msg">Posting to this chat… Momo will reply right away.</div>';
  liff.sendMessages([{type:'text',text:w+r.label+'\nCode '+r.code}]).then(function(){try{liff.closeWindow()}catch(e){}}).catch(function(){onFail()})}
function dupAct(a){
  $('ov').className='ov';$('ov2').className='ov';$('send').disabled=true;$('send').textContent='Processing…';
  var back=function(t){$('send').disabled=false;$('send').textContent='⚠️ Confirm approval';$('title').textContent=t};
  if(inClient()){dupPost({api:'dupgo',a:a}).then(function(r){if(!r||r.error){back(r?r.error:'Failed. Please try again.');return}goSend(r,function(){fail('⚠️ Could not post to this chat. Please try again.')})}).catch(function(){back('Could not send. Please try again.')});return}
  dupPost({api:'dupact',a:a}).then(function(r){
    if(!r||r.error){back(r?r.error:'Failed. Please try again.');return}
    $('list').innerHTML='';var d=document.createElement('div');d.className='read';d.textContent=r.text||'';$('list').appendChild(d);
    $('send').style.display='none';$('cancel').textContent='Close';$('title').textContent=a==='ap2'?'✅ Approved':a==='undo'?'↩️ Approval cancelled':'❌ Not approved';
    var n=document.createElement('div');n.className='msg';$('list').appendChild(n);
    var inC=false;try{inC=liffOk&&liff.isInClient()}catch(e){}
    if(r.note&&inC){n.textContent='🔔 Posting the notification to this chat…';liff.sendMessages([{type:'text',text:'🔔 '+r.note.short+'\nCode '+r.note.code}]).then(function(){n.textContent='🔔 Notification posted to this chat.'}).catch(function(){n.textContent='⚠️ Could not post the notification to this chat.'})}
    else n.textContent='🔔 Notification sent.';
  }).catch(function(){back('Could not send. Please try again.')})}
$('dok').onclick=function(){dupAct('ap2')};$('dno').onclick=function(){dupAct('dn')};
$('dun').onclick=function(){$('ov').className='ov';$('ov2').className='ov on'};$('uno').onclick=function(){$('ov2').className='ov';$('ov').className='ov on'};$('uyes').onclick=function(){dupAct('undo')};
function apNow(){$('mode').textContent='Approve';$('title').textContent='Processing…';$('send').style.display='none';$('cancel').textContent='Close';$('list').innerHTML='<div class="msg">Processing…</div>';
  dupPost({api:'apnow',a:P.a==='rj'?'rj':'ap'}).then(function(r){
