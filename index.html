<style>

</style></head><body>
<div class="top"><span id="mode">Update</span><div class="sub" id="title">กำลังโหลด…</div></div>
<div class="list" id="list"><div class="msg">กำลังโหลดรายการงาน…</div></div>
<div class="bar"><button id="cancel">Cancel</button><button id="send" disabled>📤 Submit for approval</button></div>
<div class="ov" id="ov"><div class="box"><h3>⚠️ Duplicate approval</h3><p id="dq"></p><p>Approve this again?</p><div class="row"><button id="dno">❌ Reject</button><button id="dok">✅ Approve</button></div><button id="dun">↩️ Cancel approval (restore status)</button></div></div>
<div class="ov" id="ov2"><div class="box"><h3>↩️ Cancel approval?</h3><p id="uq"></p><p>The date Momo saved will be removed from the file and this job will be open again.</p><div class="row"><button id="uno" style="background:#EEF0F3;color:#333">No, keep it</button><button id="uyes" style="background:#E53935;color:#fff">Yes, cancel</button></div></div></div>
<script>
var API='https://script.google.com/macros/s/AKfycby-mKc61mA8ltIxGrW4AcUjUjvLzAneA-A81Bb6Kknu1-fsAhGHA-422l-dJzyU389_MQ/exec';
var LIFF_ID='2012059107-CtVtW1SW', P={}, M='', DATA=null, liffOk=false;
function $(id){return document.getElementById(id)}
function qs(s){s.replace(/^\?/,'').split('&').forEach(function(kv){var a=kv.split('=');if(a[0])P[decodeURIComponent(a[0])]=decodeURIComponent((a[1]||'').replace(/\+/g,' '))})}
function api(q){return fetch(API+'?'+q).then(function(r){return r.json()})}
function closeWin(){try{if(liffOk&&liff.isInClient()){liff.closeWindow();return}}catch(e){}window.close();history.back()}
function fail(t){$('list').innerHTML='<div class="msg">'+t+'</div>';$('send').style.display='none';$('cancel').textContent='Close'}
function count(){var n=document.querySelectorAll('input:checked').length;$('send').disabled=!n;$('send').textContent=n?'📤 Submit for approval ('+n+')':'📤 Submit for approval'}
function linkify(el,s){s.split(/(https?:\/\/\S+)/).forEach(function(p){if(/^https?:\/\//.test(p)){var a=document.createElement('a');a.href=p;a.textContent=/maps|goo\.gl/.test(p)?'เปิดแผนที่ ›':p;a.style.color='#1E6FD9';a.target='_top';el.appendChild(a)}else el.appendChild(document.createTextNode(p))})}
var ROW=/^•\s*(.+?)\s+—\s+(\d+)\s*ไซต์\s*·\s*ค้าง\s*(\d+)\s*·\s*เร่ง\s*(\d+)\s*$/;
var CMP=/^•\s*(.+?)\s+—\s+เสร็จ\s*(\d+)\s*\(([^)]*)\)\s*·\s*ค้าง\s*(\d+)\s*\(([^)]*)\)\s*$/;
function readBody(el,s){var L=s.split('\n'),buf=[],rows=[];
  function fb(){if(buf.length){linkify(el,buf.join('\n')+'\n');buf=[]}}
  function fr(){if(!rows.length)return;var t=document.createElement('table');t.className='pe';
    var h='<tr><th>ผู้ดูแล</th><th>ไซต์</th><th>ค้าง</th><th>เร่ง</th></tr>';
    rows.forEach(function(m){var e=function(x){return String(x).replace(/[<&]/g,function(c){return c=='<'?'&lt;':'&amp;'})};
      h+='<tr><td>'+e(m[1])+'</td><td>'+m[2]+'</td><td class="'+(+m[3]?'r':'z')+'">'+m[3]+'</td><td class="'+(+m[4]?'o':'z')+'">'+m[4]+'</td></tr>'});
    t.innerHTML=h;el.appendChild(t);rows=[]}
  var crow=[];function dc(d,up){return d=='='?'z':((d[0]=='▲')==up?'g':'r')}
  function fc(){if(!crow.length)return;var t=document.createElement('table');t.className='pe';var h='<tr><th></th><th>เสร็จ</th><th>ค้าง</th></tr>';
    crow.forEach(function(m){h+='<tr><td>'+m[1].replace(/</g,'&lt;')+'</td><td><b>'+m[2]+'</b><small class="'+dc(m[3],true)+'">'+m[3]+'</small></td><td><b>'+m[4]+'</b><small class="'+dc(m[5],false)+'">'+m[5]+'</small></td></tr>'});
    t.innerHTML=h;el.appendChild(t);crow=[]}
  var SEC=/^(🔨 กำลังดำเนินการ|⏳ รอสำรวจ \(|⚠️ ยังค้าง \(|✅ ปิดงานแล้ว \(|✅ สำรวจแล้ว|✅ ปิดแล้ว)/;
  L.forEach(function(l){if(/^┈{6,}$/.test(l)){fb();fr();fc();var h=document.createElement('hr');h.className='sub';el.appendChild(h);return}
    if(SEC.test(l)){fb();fr();fc();var d=document.createElement('div');d.className='sec '+(/^✅/.test(l)?'ok':'wip');d.textContent=l;el.appendChild(d);return}
    var c=l.match(CMP);if(c){fb();fr();crow.push(c);return}fc();var m=l.match(ROW);if(m){fb();rows.push(m)}else{fr();buf.push(l)}});fc();fr();fb()}
function render(r){
  if(!r||r.error){fail(r?r.error:'โหลดไม่สำเร็จ');return}
  DATA=r;$('title').textContent=r.title||'';$('list').innerHTML='';$('send').style.display='';
  if(M==='read'){
    $('mode').textContent='Details';
    var d=document.createElement('div');d.className='read';readBody(d,r.body||'-');$('list').appendChild(d);
    $('cancel').textContent='Close';
    if(r.own&&r.items.length){$('send').disabled=false;$('send').textContent='✅ Update ('+r.items.length+')';$('send').onclick=function(){M='';$('send').onclick=send;render(DATA)}}
    else $('send').style.display='none';
    return;
  }
  $('mode').textContent='Update';$('cancel').textContent='Cancel';
  if(!r.items.length){fail('ชีทนี้ไม่มีงานค้างให้อัปเดตแล้ว 🎉');return}
  r.items.forEach(function(t,i){var l=document.createElement('label'),c=document.createElement('input'),s=document.createElement('span');c.type='checkbox';c.value=i;c.onchange=count;s.textContent=t;l.appendChild(c);l.appendChild(s);$('list').appendChild(l)});
  count();
}
function send(){
  var idx=[].map.call(document.querySelectorAll('input:checked'),function(c){return c.value});
  if(!idx.length)return;$('send').disabled=true;$('send').textContent='Sending…';
  api('api=submit&k='+P.k+'&i='+P.i+'&idx='+idx.join(',')).then(function(r){
    if(!r||r.error){$('send').disabled=false;count();$('title').textContent=r?r.error:'ส่งไม่สำเร็จ';return}
    var ok=false;try{ok=liffOk&&liff.isInClient()}catch(e){}
    if(ok) liff.sendMessages([{type:'text',text:r.text}]).then(function(){liff.closeWindow()}).catch(function(){manual(r.text)});
    else manual(r.text);
  }).catch(function(e){$('send').disabled=false;count();$('title').textContent='ส่งไม่สำเร็จ ลองใหม่อีกครั้ง'});
}
function manual(t){
  $('list').innerHTML='<div class="msg">✅ บันทึกรายการแล้ว<br>กดปุ่มด้านล่าง แล้วเลือกกลุ่มงานเพื่อส่งขออนุมัติ</div><a style="display:block;margin:6px 12px;padding:14px;border-radius:10px;background:#06C755;color:#fff;text-align:center;font-weight:700;text-decoration:none" href="https://line.me/R/share?text='+encodeURIComponent(t)+'">📤 Send to LINE group</a><div class="msg" style="font-size:13px">หรือคัดลอกข้อความนี้ไปวางในกลุ่ม<textarea readonly>'+t.replace(/</g,'&lt;')+'</textarea></div>';
  $('send').style.display='none';$('cancel').textContent='Close';
}
$('send').onclick=send;$('cancel').onclick=closeWin;
function renderDup(r){if(!r||r.error){fail(r?r.error:'Could not load. Please close and open again.');return}
  DATA=r;$('mode').textContent='Approve';$('title').textContent=r.title||'';$('list').innerHTML='';
  var d=document.createElement('div');d.className='read';readBody(d,r.body||'-');$('list').appendChild(d);
  $('dq').textContent=(r.label||'')+'\n'+(r.why||'');$('uq').textContent=r.label||'';$('dun').style.display=r.canUndo?'block':'none';$('cancel').textContent='Close';
  $('send').style.display='';$('send').disabled=false;$('send').textContent='⚠️ Confirm approval';$('send').onclick=function(){$('ov').className='ov on'};
  $('ov').className='ov on'}
function dupTok(){var at='';try{if(liffOk)at=liff.getAccessToken()||''}catch(e){}return at}
function dupPost(o){o.at=dupTok();o.d=P.d||'';o.n=P.n||'';try{var c=liffOk&&liff.getContext();if(c){o.ctx=c.type||'';o.cg=c.groupId||c.roomId||''}}catch(e){}return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)}).then(function(x){return x.json()})}
function inClient(){try{return liffOk&&liff.isInClient()}catch(e){return false}}
function goSend(r,onFail){var w={ap:'✅ Approve: ',ap2:'✅ Approve again: ',rj:'❌ Reject: ',dn:'❌ Reject: ',undo:'↩️ Cancel approval: '}[r.act]||'✅ Approve: ';
  $('title').textContent=r.act==='rj'||r.act==='dn'?'❌ Not approved':r.act==='undo'?'↩️ Cancelling approval…':'✅ Approved';$('send').style.display='none';$('cancel').textContent='Close';
  $('list').innerHTML='<div class="msg">Posting to this chat… Momo will reply right away.</div>';
  liff.sendMessages([{type:'text',text:w+r.label+'\nรหัส '+r.code}]).then(function(){try{liff.closeWindow()}catch(e){}}).catch(function(){onFail()})}
function dupAct(a){
  $('ov').className='ov';$('ov2').className='ov';$('send').disabled=true;$('send').textContent='Processing…';
  var back=function(t){$('send').disabled=false;$('send').textContent='⚠️ Confirm approval';$('title').textContent=t};
  if(inClient()){dupPost({api:'dupgo',a:a}).then(function(r){if(!r||r.error){back(r?r.error:'Failed. Please try again.');return}goSend(r,function(){fail('⚠️ Could not post to this chat. Please try again.')})}).catch(function(){back('Could not send. Please try again.')});return}
  dupPost({api:'dupact',a:a}).then(function(r){
    if(!r||r.error){back(r?r.error:'Failed. Please try again.');return}
    $('list').innerHTML='';var d=document.createElement('div');d.className='read';d.textContent=r.text||'';$('list').appendChild(d);
    $('send').style.display='none';$('cancel').textContent='Close';$('title').textContent=a==='ap2'?'✅ Approved':a==='undo'?'↩️ Approval cancelled':'❌ Not approved';
    var n=document.createElement('div');n.className='msg';$('list').appendChild(n);
    var inC=false;try{inC=liffOk&&liff.isInClient()}catch(e){}
    if(r.note&&inC){n.textContent='🔔 Posting the notification to this chat…';liff.sendMessages([{type:'text',text:'🔔 '+r.note.short+'\nรหัส '+r.note.code}]).then(function(){n.textContent='🔔 Notification posted to this chat.'}).catch(function(){n.textContent='⚠️ Could not post the notification to this chat.'})}
    else n.textContent='🔔 Notification sent.';
  }).catch(function(){back('Could not send. Please try again.')})}
$('dok').onclick=function(){dupAct('ap2')};$('dno').onclick=function(){dupAct('dn')};
$('dun').onclick=function(){$('ov').className='ov';$('ov2').className='ov on'};$('uno').onclick=function(){$('ov2').className='ov';$('ov').className='ov on'};$('uyes').onclick=function(){dupAct('undo')};
function apNow(){$('mode').textContent='Approve';$('title').textContent='Processing…';$('send').style.display='none';$('cancel').textContent='Close';$('list').innerHTML='<div class="msg">Processing…</div>';
  dupPost({api:'apnow',a:P.a==='rj'?'rj':'ap'}).then(function(r){
    if(!r||r.error){fail(r?r.error:'Could not load. Please close and open again.');return}
    if(r.dup){P.n=r.n;renderDup(r);return}
    if(r.go){if(inClient())goSend(r,function(){fail('⚠️ Could not post to this chat. Please close and tap the button again.')});else fail('Please open this from the LINE app.');return}
    $('title').textContent=r.act==='rj'?'❌ Not approved':(/^⏳/.test(r.text||'')?'⏳ Approved':'✅ Approved');
    $('list').innerHTML='';var d=document.createElement('div');d.className='read';d.textContent=r.text||'';$('list').appendChild(d);
    var n=document.createElement('div');n.className='msg';$('list').appendChild(n);
    var inC=false;try{inC=liffOk&&liff.isInClient()}catch(e){}
    if(r.note&&inC){n.textContent='🔔 Posting the result to this chat…';liff.sendMessages([{type:'text',text:'🔔 '+r.note.short+'\nรหัส '+r.note.code}]).then(function(){n.textContent='🔔 Posted. Closing…';setTimeout(function(){try{liff.closeWindow()}catch(e){}},1200)}).catch(function(){n.textContent='⚠️ Could not post the result to this chat.'})}
    else n.textContent='🔔 Notification sent.';
  }).catch(function(){fail('Could not load. Please close and open again.')})}
var FT={sv:'Site survey',so:'Solar project',ev:'EV project',cp:'Complaint',ms:'Milestones',dc:'Documents',del:'Delete site',rn:'Rename site'},OPT=null;
var RN=null;
function rnBuild(){var box=$('list');box.innerHTML='';var body=document.createElement('div');
  projPick(box,function(v){RN=null;fcheck();if(!v){body.innerHTML='';return}body.innerHTML='<div class="msg">Checking the file…</div>';
    dupPost({api:'frn',project:v}).then(function(r){if(!r||r.error){body.innerHTML='<div class="msg">'+hesc(r?r.error:'Could not load.')+'</div>';return}RN=r;rnFields(body)}).catch(function(){body.innerHTML='<div class="msg">Could not load. Please try again.</div>'})});
  box.appendChild(body);$('send').style.display='';$('send').onclick=fsubmit;fcheck()}
function rnFields(body){var r=RN;body.innerHTML='';var w=document.createElement('div');w.className='fld';
  w.innerHTML='<div class="fl">New name *</div>';var el=document.createElement('input');el.type='text';el.id='f_name';el.value=r.project;el.oninput=fcheck;w.appendChild(el);
  if(r.ev){var h=document.createElement('div');h.className='fh';h.textContent='"EV " stays at the front of the name.';w.appendChild(h)}body.appendChild(w);
  var c=document.createElement('div');c.className='fld';
  if(!r.total){c.innerHTML='<div class="fl">Not found</div><div class="fh">"'+hesc(r.project)+'" was not found in any sheet.</div>';body.appendChild(c);fcheck();return}
  var s='<div class="fl">Will be renamed in '+hesc(r.file)+'</div>';
  r.items.forEach(function(it){s+='<div class="drow"><div class="dn">'+hesc(it.sh)+'</div><div class="dn" style="flex:0 0 auto;text-align:right;color:#555">'+(it.auto?'row '+it.rows[0]+' · follows Projects':'row'+(it.rows.length>1?'s ':' ')+it.rows.join(', '))+'</div></div>'});
  s+='<div class="fh" style="margin-top:8px">All sheets are renamed together, so they stay matched.</div>';c.innerHTML=s;body.appendChild(c);el.focus();fcheck()}
var DEL=null;
function hesc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function delBuild(){var box=$('list');box.innerHTML='';var body=document.createElement('div');
  projPick(box,function(v){DEL=null;fcheck();if(!v){body.innerHTML='';return}body.innerHTML='<div class="msg">Checking the file…</div>';
    dupPost({api:'fdel',project:v}).then(function(r){if(!r||r.error){body.innerHTML='<div class="msg">'+hesc(r?r.error:'Could not load.')+'</div>';return}DEL=r;delFields(body)}).catch(function(){body.innerHTML='<div class="msg">Could not load. Please try again.</div>'})});
  box.appendChild(body);$('send').style.display='';$('send').classList.add('danger');$('send').onclick=fsubmit;fcheck()}
function delFields(body){var r=DEL;body.innerHTML='';var c=document.createElement('div');c.className='fld';
  if(!r.total){c.innerHTML='<div class="fl">Nothing to delete</div><div class="fh">"'+hesc(r.project)+'" was not found in any sheet.</div>';body.appendChild(c);fcheck();return}
  var h='<div class="fl" style="color:#C62828">Will be removed from '+hesc(r.file)+'</div>';
  r.items.forEach(function(it){h+='<div class="drow"><div class="dn">'+hesc(it.sh)+'</div><div class="dn" style="flex:0 0 auto;text-align:right;color:#555">'+(it.shift?'row '+it.rows[0]+(it.end>it.rows[0]?' · rows below move up 1':''):'row'+(it.rows.length>1?'s ':' ')+it.rows.join(', '))+'</div></div>'});
  h+='<div class="fh" style="margin-top:8px">Only typed data is cleared — formulas stay. The version before this delete stays in Google Drive version history.</div>';
  c.innerHTML=h;body.appendChild(c);
  var w=document.createElement('div');w.className='fld';w.innerHTML='<label style="display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer"><input type="checkbox" id="d_ok" style="width:20px;height:20px">Yes, delete “'+hesc(r.project)+'”</label>';body.appendChild(w);$('d_ok').onchange=fcheck;fcheck()}
var DC=null,DSEL={};
function pfOk(p,f){return!f||(f==='sv'?!!p.sv:!p.sv&&(f==='ev')===!!p.ev)}
function pfSeg(){return'<span class="seg" id="pf"><b data-f="">All</b><b data-f="so">☀️ Solar</b><b data-f="ev">⚡ EV</b>'+((OPT.projects||[]).some(function(p){return p.sv})?'<b data-f="sv">🔭 Survey</b>':'')+'</span>'}
